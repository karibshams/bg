<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Black Background -->
  <rect width="300" height="300" rx="36" fill="#000000" />

  <g transform="translate(15, 10)">
    <!-- Kite Component -->
    <g transform="translate(180, 25)">
      <!-- Kite frame & facets -->
      <!-- Top sail: Sky Blue -->
      <polygon points="45,10 75,45 45,45" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
      <!-- Right sail: White / Light Gray -->
      <polygon points="45,10 75,45 45,78" fill="#F8FAFC" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
      <!-- Left sail: Deep Navy Blue -->
      <polygon points="15,45 45,10 45,78" fill="#0284C7" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
      <!-- Bottom-right sail: Vibrant Green -->
      <polygon points="45,45 75,45 45,78" fill="#22C55E" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />

      <!-- Center spine and spar -->
      <line x1="45" y1="10" x2="45" y2="78" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 15,45 Q 45,55 75,45" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />

      <!-- Kite bottom tail / bow: Gold / Yellow -->
      <polygon points="45,78 35,90 55,90" fill="#FACC15" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />

      <!-- White string connecting kite to Bengali typography -->
      <path d="M 45,90 Q 70,105 50,125 Q 35,138 42,150" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" />
    </g>

    <!-- Bengali Wordmark: ভ্রমণঘুড়ি with White Outline and Sky Blue Fill -->
    <g transform="translate(135, 205)">
      <!-- White contour / stroke layer -->
      <text text-anchor="middle" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="62" font-weight="900"
            fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" letter-spacing="1">
        ভ্রমণঘুড়ি
      </text>

      <!-- Cyan / Sky Blue Inner Fill -->
      <text text-anchor="middle" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="62" font-weight="900"
            fill="#0EA5E9" letter-spacing="1">
        ভ্রমণঘুড়ি
      </text>
    </g>
  </g>
</svg>
