<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logoKite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Kite Symbol -->
  <g transform="translate(4, 4)">
    <!-- Shadow -->
    <ellipse cx="28" cy="52" rx="14" ry="3" fill="#0F172A" opacity="0.15" />
    
    <!-- Kite Body -->
    <polygon points="28,6 48,27 28,50 8,27" fill="url(#logoKite)" />
    <!-- Panel Highlights -->
    <polygon points="28,6 48,27 28,27" fill="#7DD3FC" opacity="0.6" />
    <polygon points="28,27 48,27 28,50" fill="#0369A1" opacity="0.85" />
    <polygon points="8,27 28,27 28,50" fill="#0284C7" opacity="0.95" />
    <polygon points="8,27 28,6 28,27" fill="#38BDF8" opacity="0.75" />
    
    <!-- Ribs -->
    <line x1="28" y1="6" x2="28" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 8,27 Q 28,32 48,27" stroke="#FFFFFF" stroke-width="1.4" fill="none" />
    
    <!-- Tail -->
    <path d="M 28,50 Q 34,56 26,60" stroke="#10B981" stroke-width="1.8" fill="none" />
    <polygon points="28,50 24,54 32,54" fill="url(#tailGrad)" />
    <polygon points="26,60 22,63 30,63" fill="url(#tailGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(64, 12)">
    <!-- Bengali Wordmark -->
    <text x="0" y="26" font-family="'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="0.5">
      ভ্রমণ<tspan fill="#0284C7">ঘুড়ি</tspan>
    </text>
    
    <!-- English Subtitle / Tagline -->
    <text x="2" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#64748B" letter-spacing="2.2">
      BHROMONGHURI • TRAVEL
    </text>
  </g>
</svg>
