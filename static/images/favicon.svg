<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Bhromonghuri Official Kite Vector -->
  <g transform="translate(10, 4) scale(0.85)">
    <!-- White outer contour backing -->
    <path d="M 50,4 L 92,42 L 50,86 L 14,44 Z" fill="#000000" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" />

    <!-- Kite Facets -->
    <!-- Top sail: Sky Blue -->
    <polygon points="50,6 90,42 50,42" fill="#6ACCFB" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Left sail: Pale Cyan / White -->
    <polygon points="16,44 50,6 50,42" fill="#E0F2FE" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Bottom-left facet: Black -->
    <polygon points="16,44 50,42 50,84" fill="#0F172A" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Bottom-right facet: Vibrant Green -->
    <polygon points="50,42 90,42 50,84" fill="#22C55E" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Center spine and cross spar -->
    <line x1="50" y1="6" x2="50" y2="84" stroke="#000000" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="44" x2="90" y2="42" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />

    <!-- Tail ribbon / bow: Yellow with White stroke -->
    <polygon points="50,84 38,98 62,98" fill="#FACC15" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" />
    <polygon points="50,86 42,96 58,96" fill="#FACC15" stroke="#000000" stroke-width="2" stroke-linejoin="round" />

    <!-- String curl -->
    <path d="M 62,98 Q 78,102 72,110" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" />
  </g>
</svg>
