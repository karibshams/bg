<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="kiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Kite diamond body -->
  <polygon points="50,10 82,45 50,85 18,45" fill="url(#kiteGrad)" filter="url(#glow)" />
  
  <!-- Facets / Sail panels -->
  <polygon points="50,10 82,45 50,45" fill="#7DD3FC" opacity="0.6" />
  <polygon points="50,45 82,45 50,85" fill="#0369A1" opacity="0.8" />
  <polygon points="18,45 50,45 50,85" fill="#0284C7" opacity="0.9" />
  <polygon points="18,45 50,10 50,45" fill="#38BDF8" opacity="0.8" />
  
  <!-- Center spine & cross spar -->
  <line x1="50" y1="10" x2="50" y2="85" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <path d="M 18,45 Q 50,52 82,45" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  
  <!-- Kite tail and decorative bows -->
  <path d="M 50,85 Q 58,95 48,102 Q 40,110 52,118" stroke="#10B981" stroke-width="2" fill="none" stroke-dasharray="1 1" />
  <polygon points="50,85 45,91 55,91" fill="url(#accentGrad)" />
  <polygon points="48,102 43,107 53,107" fill="url(#accentGrad)" />
</svg>
