{% load static %}
<div class="relative group rounded-2xl overflow-hidden shadow-md hover:shadow-2xl transition-all duration-500 h-72">
  <!-- Background Image or Gradient -->
  <div class="absolute inset-0 bg-slate-900">
    {% if destination.cover_image %}
    <img src="{{ destination.cover_image.url }}" alt="{{ destination.name }}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
    {% else %}
    <div class="w-full h-full bg-gradient-to-t from-slate-950 via-slate-900 to-sky-950 flex items-center justify-center p-6">
      <i data-lucide="map" class="w-16 h-16 text-sky-500/20 group-hover:scale-125 transition-transform duration-500"></i>
    </div>
    {% endif %}
  </div>

  <!-- Gradient Overlay -->
  <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/50 to-transparent"></div>

  <!-- Content -->
  <div class="absolute inset-0 p-6 flex flex-col justify-end text-white">
    <span class="text-xs font-semibold text-sky-400 tracking-wider uppercase mb-1 trans-target"
          data-en="{{ destination.tours.count }} Tour Packages" 
          data-bn="{{ destination.tours.count }}টি ট্যুর প্যাকেজ">
      {{ destination.tours.count }} Tour Packages
    </span>
    <h3 class="font-sans text-2xl font-bold text-white group-hover:text-sky-300 transition-colors trans-target"
        data-en="{{ destination.name }}"
        data-bn="{{ destination.bangla_name|default:destination.name }}">
      {{ destination.name }}
    </h3>
    <p class="text-xs text-slate-300 line-clamp-2 mb-4 leading-relaxed trans-target"
       data-en="{{ destination.description }}"
       data-bn="{{ destination.bangla_description|default:destination.tagline|default:destination.description }}">
      {{ destination.description }}
    </p>
    
    <a href="{% url 'tours:destination_detail' destination.slug %}" 
       class="inline-flex items-center space-x-2 text-xs font-bold text-sky-400 hover:text-white group/link">
      <span class="trans-target" data-en="View Tours" data-bn="ট্যুরগুলো দেখুন">View Tours</span>
      <i data-lucide="arrow-right" class="w-3.5 h-3.5 transform group-hover/link:translate-x-1 transition-transform"></i>
    </a>
  </div>
</div>
