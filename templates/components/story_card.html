{% load static %}
<div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-100 flex flex-col group">
  <div class="relative h-48 overflow-hidden bg-slate-900">
    {% if story.cover_image %}
    <img src="{{ story.cover_image.url }}" alt="{{ story.title }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
    {% else %}
    <div class="w-full h-full bg-gradient-to-tr from-slate-900 via-sky-950 to-slate-800 flex items-center justify-center">
      <i data-lucide="book-open" class="w-10 h-10 text-sky-400/40"></i>
    </div>
    {% endif %}

    {% if story.destination %}
    <span class="absolute top-3 left-3 px-3 py-1 rounded-full text-xs font-semibold bg-slate-900/80 backdrop-blur-md text-sky-300 border border-white/10">
      {{ story.destination.name }}
    </span>
    {% endif %}
  </div>

  <div class="p-6 flex flex-col flex-grow justify-between space-y-4">
    <div class="space-y-2">
      <div class="flex items-center space-x-3 text-xs text-slate-400 font-medium">
        <span>{{ story.author_name }}</span>
        <span>•</span>
        <span>{{ story.read_time }}</span>
      </div>

      <h3 class="font-bengali text-lg font-bold text-slate-900 group-hover:text-sky-600 transition-colors line-clamp-2">
        <a href="{% url 'stories:detail' story.slug %}">{{ story.title }}</a>
      </h3>

      <p class="font-bengali text-xs text-slate-600 line-clamp-3 leading-relaxed">
        {{ story.excerpt }}
      </p>
    </div>

    <div class="pt-2 border-t border-slate-100">
      <a href="{% url 'stories:detail' story.slug %}" 
         class="inline-flex items-center space-x-1.5 text-xs font-bold text-sky-600 hover:text-sky-700 font-bengali group/read">
        <span>পুরো গল্প পড়ুন</span>
        <i data-lucide="arrow-right" class="w-3.5 h-3.5 transform group-hover/read:translate-x-1 transition-transform"></i>
      </a>
    </div>
  </div>
</div>
