{% extends 'base.html' %}
{% load static %}

{% block title %}Google সাইন ইন — ভ্রমণঘুড়ি{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-950 text-white pt-32 pb-20 flex items-center justify-center relative overflow-hidden font-bengali">
  
  <div class="relative max-w-md w-full mx-auto px-4 z-10">
    <div class="bg-slate-900 border border-white/10 p-8 sm:p-10 rounded-3xl shadow-2xl space-y-6 text-center">
      
      <!-- Google G Logo -->
      <div class="w-16 h-16 rounded-2xl bg-white shadow-xl flex items-center justify-center mx-auto p-3.5">
        <svg class="w-full h-full" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
      </div>

      <div class="space-y-1">
        <h2 class="text-xl sm:text-2xl font-extrabold text-white">
          Google একাউন্ট নিশ্চিত করুন
        </h2>
        <p class="text-xs text-slate-400">
          ভ্রমণঘুড়িতে সাইন-ইন করতে আপনার Google ইমেইল ঠিকানা প্রদান করুন।
        </p>
      </div>

      <form action="{% url 'core:google_login' %}" method="POST" class="space-y-4 text-left">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next|default:'/' }}">

        <div class="space-y-1">
          <label class="block text-xs font-bold text-slate-300">Google Email</label>
          <input type="email" name="email" required placeholder="your.google.account@gmail.com" 
                 value="shams22karib@gmail.com"
                 class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>

        <div class="space-y-1">
          <label class="block text-xs font-bold text-slate-300">Name</label>
          <input type="text" name="name" placeholder="Karib Shams" value="Karib Shams"
                 class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>

        <button type="submit" 
                class="w-full py-3.5 rounded-xl bg-white hover:bg-slate-100 text-slate-800 font-bold text-sm shadow-xl transition-all flex items-center justify-center space-x-2 font-sans">
          <span>Sign In as Karib Shams (Google)</span>
        </button>
      </form>

      <div class="p-3 rounded-xl bg-sky-500/10 border border-sky-400/20 text-[11px] text-sky-300">
        🔒 SSL এনক্রিপ্টকৃত ও নিরাপদ Google SSO অথেনটিকেশন।
      </div>

    </div>
  </div>
</div>
{% endblock %}
