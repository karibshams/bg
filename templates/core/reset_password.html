{% extends 'base.html' %}
{% load static %}

{% block title %}Set New Password — BhromonGhuri{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-950 text-white pt-28 pb-20 flex items-center justify-center relative overflow-hidden font-bengali">
  
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(14,165,233,0.2),rgba(255,255,255,0))]"></div>
  <div class="absolute -bottom-32 -left-32 w-80 h-80 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative max-w-md w-full mx-auto px-4 z-10">
    
    <div class="bg-slate-900/90 backdrop-blur-xl border border-white/10 p-7 sm:p-9 rounded-3xl shadow-2xl space-y-5 text-center">
      
      <!-- Icon -->
      <div class="w-16 h-16 rounded-2xl bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 flex items-center justify-center mx-auto shadow-lg shadow-emerald-500/10">
        <i data-lucide="lock" class="w-8 h-8"></i>
      </div>

      <div class="space-y-1">
        <h1 class="text-2xl font-extrabold text-white trans-target" data-en="Create New Password" data-bn="নতুন পাসওয়ার্ড দিন">
          Create New Password
        </h1>
        <p class="text-xs text-slate-300 leading-relaxed">
          <span class="trans-target" data-en="Enter the 6-digit security code sent to:" data-bn="নিচের ঠিকানায় পাঠানো ৬-সংখ্যার কোডটি দিন:">Enter the 6-digit security code sent to:</span>
          <br>
          <span class="font-bold text-sky-400 font-mono text-sm">{{ email }}</span>
        </p>
      </div>

      <!-- Form -->
      <form method="POST" action="{% url 'core:reset_password' %}" class="space-y-3.5 text-left">
        {% csrf_token %}
        <input type="hidden" name="email" value="{{ email }}">

        <!-- OTP Code -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 trans-target" data-en="6-Digit Reset Code (OTP)" data-bn="৬-সংখ্যার রিসেট কোড (ওটিপি)">
            6-Digit Reset Code (OTP)
          </label>
          <input type="text" 
                 name="otp_code" 
                 maxlength="6"
                 required 
                 autofocus
                 placeholder="123456"
                 class="w-full py-2.5 text-center tracking-[0.4em] text-xl font-mono font-bold bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
        </div>

        <!-- New Password -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 trans-target" data-en="New Password (Min. 6 chars)" data-bn="নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)">
            New Password (Min. 6 chars)
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </span>
            <input type="password" 
                   id="reset-new-password"
                   name="new_password" 
                   required 
                   placeholder="••••••••"
                   class="w-full pl-10 pr-10 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all">
            <button type="button" 
                    onclick="togglePasswordVisibility('reset-new-password', this)"
                    class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-200 focus:outline-none">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 trans-target" data-en="Confirm New Password" data-bn="পাসওয়ার্ড নিশ্চিত করুন">
            Confirm New Password
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
              <i data-lucide="check-check" class="w-4 h-4"></i>
            </span>
            <input type="password" 
                   id="reset-confirm-password"
                   name="confirm_password" 
                   required 
                   placeholder="••••••••"
                   class="w-full pl-10 pr-10 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all">
            <button type="button" 
                    onclick="togglePasswordVisibility('reset-confirm-password', this)"
                    class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-200 focus:outline-none">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" 
                class="w-full mt-2 py-3 px-4 rounded-xl bg-gradient-to-r from-sky-500 to-emerald-500 hover:from-sky-400 hover:to-emerald-400 text-white font-bold text-sm shadow-lg shadow-sky-500/20 flex items-center justify-center space-x-2 transition-all duration-200 transform hover:-translate-y-0.5">
          <i data-lucide="check-circle" class="w-4 h-4"></i>
          <span class="trans-target" data-en="Update Password & Sign In" data-bn="পাসওয়ার্ড পরিবর্তন করুন">Update Password & Sign In</span>
        </button>
      </form>

      <!-- Resend -->
      <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
        <span class="trans-target" data-en="Didn't get code?" data-bn="কোড পাননি?">Didn't get code?</span>
        <a href="{% url 'core:resend_otp' %}?email={{ email }}&purpose=reset_password" 
           class="text-sky-400 hover:text-sky-300 font-bold flex items-center space-x-1">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span class="trans-target" data-en="Resend Code" data-bn="পুনরায় কোড পাঠান">Resend Code</span>
        </a>
      </div>

    </div>

  </div>
</div>

<script>
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  if (!input) return;
  if (input.type === 'password') {
    input.type = 'text';
    btn.innerHTML = '<i data-lucide="eye-off" class="w-4 h-4"></i>';
  } else {
    input.type = 'password';
    btn.innerHTML = '<i data-lucide="eye" class="w-4 h-4"></i>';
  }
  if (window.lucide) lucide.createIcons();
}
</script>
{% endblock %}
