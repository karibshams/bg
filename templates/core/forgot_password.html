{% extends 'base.html' %}
{% load static %}

{% block title %}Forgot Password — BhromonGhuri{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-950 text-white pt-28 pb-20 flex items-center justify-center relative overflow-hidden font-bengali">
  
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(14,165,233,0.2),rgba(255,255,255,0))]"></div>
  <div class="absolute -top-32 -right-32 w-80 h-80 bg-sky-500/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative max-w-md w-full mx-auto px-4 z-10">
    
    <div class="bg-slate-900/90 backdrop-blur-xl border border-white/10 p-7 sm:p-9 rounded-3xl shadow-2xl space-y-5 text-center">
      
      <!-- Icon -->
      <div class="w-16 h-16 rounded-2xl bg-sky-500/20 border border-sky-500/30 text-sky-400 flex items-center justify-center mx-auto shadow-lg shadow-sky-500/10">
        <i data-lucide="key-round" class="w-8 h-8"></i>
      </div>

      <div class="space-y-1">
        <h1 class="text-2xl font-extrabold text-white trans-target" data-en="Reset Your Password" data-bn="পাসওয়ার্ড রিসেট">
          Reset Your Password
        </h1>
        <p class="text-xs text-slate-300 leading-relaxed trans-target" 
           data-en="Enter your registered Gmail address. We will send a 6-digit security code to reset your password." 
           data-bn="আপনার নিবন্ধিত জিমেইল এড্রেসটি দিন। আমরা একটি ৬-সংখ্যার সিকিউরিটি কোড পাঠাব।">
          Enter your registered Gmail address. We will send a 6-digit security code to reset your password.
        </p>
      </div>

      <!-- Form -->
      <form method="POST" action="{% url 'core:forgot_password' %}" class="space-y-4 text-left">
        {% csrf_token %}

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 trans-target" data-en="Registered Gmail Address" data-bn="নিবন্ধিত জিমেইল এড্রেস">
            Registered Gmail Address
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
              <i data-lucide="mail" class="w-4 h-4"></i>
            </span>
            <input type="email" 
                   name="email" 
                   value="{{ email|default:'' }}"
                   required 
                   autofocus
                   placeholder="yourname@gmail.com"
                   class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all">
          </div>
        </div>

        <button type="submit" 
                class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-sky-500 to-emerald-500 hover:from-sky-400 hover:to-emerald-400 text-white font-bold text-sm shadow-lg shadow-sky-500/20 flex items-center justify-center space-x-2 transition-all duration-200 transform hover:-translate-y-0.5">
          <i data-lucide="send" class="w-4 h-4"></i>
          <span class="trans-target" data-en="Send Reset Code" data-bn="রিসেট কোড পাঠান">Send Reset Code</span>
        </button>
      </form>

      <div class="pt-2 border-t border-slate-800/80">
        <a href="{% url 'core:login' %}" class="text-xs text-slate-400 hover:text-white font-semibold transition-colors flex items-center justify-center space-x-1">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span class="trans-target" data-en="Back to Sign In" data-bn="লগইনে ফিরে যান">Back to Sign In</span>
        </a>
      </div>

    </div>

  </div>
</div>
{% endblock %}
