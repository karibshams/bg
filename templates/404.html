{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found (404) — BhromonGhuri{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center pt-28 pb-16 bg-slate-50 text-center px-4">
  <div class="max-w-md space-y-6">
    <div class="w-24 h-24 mx-auto animate-kite-hover">
      <img src="{% static 'images/logo-kite.png' %}" alt="404 Kite" class="w-full h-full object-contain filter drop-shadow-[0_8px_16px_rgba(14,165,233,0.3)]">
    </div>
    <span class="text-xs font-bold tracking-widest text-sky-600 uppercase font-sans">ERROR 404</span>
    <h1 class="font-bengali text-3xl font-extrabold text-slate-900 trans-target"
        data-en="This Trail Could Not Be Found!"
        data-bn="এই পথটি খুঁজে পাওয়া যায়নি!">
      This Trail Could Not Be Found!
    </h1>
    <p class="font-bengali text-sm text-slate-600 trans-target"
       data-en="The page you are looking for might have been moved or the URL is incorrect."
       data-bn="আপনি যে পৃষ্ঠাটি খুঁজছেন তা হয়তো সরানো হয়েছে অথবা লিংকটি সঠিক নয়।">
      The page you are looking for might have been moved or the URL is incorrect.
    </p>
    <div>
      <a href="{% url 'core:home' %}" class="inline-flex items-center space-x-2 px-6 py-3 rounded-full bg-sky-500 hover:bg-sky-400 text-white font-bold text-xs font-bengali shadow-md">
        <i data-lucide="home" class="w-4 h-4"></i>
        <span class="trans-target" data-en="Return to Homepage" data-bn="হোম পেজে ফিরে যান">Return to Homepage</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}
